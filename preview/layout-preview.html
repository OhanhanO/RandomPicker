<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #dfe4ee; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; padding: 20px; }
  .win { width: 962px; height: 672px; background: #EEF2F9; position: relative; border: 1px solid #b8c0ce; }
  .titlebar { height: 30px; background: #fbfcfd; border-bottom: 1px solid #dde1e7;
              font-size: 12px; color: #555; display: flex; align-items: center;
              justify-content: space-between; padding: 0 12px; }
  .tb { display:flex; align-items:center; gap:6px; }
  .client { position: absolute; left: 1px; top: 31px; right: 1px; bottom: 1px;
            background: #EEF2F9; overflow: hidden; }
  .abs { position: absolute; }
  .title { font-size: 31px; font-weight: 700; color: #171B22; left: 40px; top: 22px; letter-spacing: .5px; }
  .label { font-size: 15px; color: #7C8491; }
  .edit { height: 64px; border: 1px solid #E5E9F1; border-radius: 14px; background: #fff;
          display: flex; align-items: center; padding: 0 18px; font-size: 24px; color: #171B22; }
  .btn { height: 64px; background: #3B6EF6; border-radius: 16px; color: #fff;
         font-size: 26px; font-weight: 700; display: flex; align-items: center;
         justify-content: center; letter-spacing: 6px; }
  .reel { left: 40px; top: 214px; width: 880px; height: 220px; background: #fff;
          border: 1px solid #E5E9F1; border-radius: 20px; overflow: hidden;
          box-shadow: 0 3px 0 #E0E5EE, 0 6px 0 #E8EDF6; }
  .tile { position: absolute; top: 35px; width: 120px; height: 150px; border-radius: 14px;
          border: 2px solid #ccc; display: flex; align-items: center; justify-content: center;
          font-size: 46px; font-weight: 700; color: #171B22; }
  .tile .bar { position: absolute; left: 10px; right: 10px; bottom: 7px; height: 5px; border-radius: 3px; }
  .gold { border-color: #F0B429; border-width: 3px; background: #FDF4E2;
          box-shadow: 0 0 0 5px rgba(240,180,41,.20), 0 0 0 11px rgba(240,180,41,.11),
                      0 0 0 18px rgba(240,180,41,.06); }
  .pointer { display:none; position: absolute;
             background: #9DB8FA; }
  .tri { position: absolute; left: 465px; top: 4px; width: 0; height: 0;
         border-left: 15px solid transparent; border-right: 15px solid transparent;
         border-top: 12px solid #3B6EF6; }
  .card { left: 40px; top: 458px; width: 880px; height: 136px; background: #fff;
          border: 1px solid #E5E9F1; border-radius: 20px;
          box-shadow: 0 3px 0 #E0E5EE, 0 6px 0 #E8EDF6; }
  .cardlabel { font-size: 15px; color: #7C8491; left: 22px; top: 12px; }
  .result { left: 14px; top: 42px; right: 14px; bottom: 10px; border: 1px solid #E5E9F1;
            border-radius: 14px; background: #F7FAFF; display: flex; align-items: center;
            justify-content: center; font-size: 64px; font-weight: 700; color: #171B22; }
  .switch { width: 56px; height: 30px; background: #3B6EF6; border-radius: 15px; }
  .knob { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px;
          background: #fff; border-radius: 11px; }
  .tri2 { top: auto; bottom: 4px; border-top: none; border-bottom: 12px solid #3B6EF6; }
</style>
</head>
<body>

<div class="win">
  <div class="titlebar"><span class="tb"><img src="icon-32.png" width="16" height="16">随机抽号器</span><span>—　□　×</span></div>
  <div class="client">
    <div class="abs title">随机抽号器</div>

    <div class="abs label" style="left:802px; top:42px; width:54px; text-align:right;">音效</div>
    <div class="abs switch" style="left:864px; top:38px;"><div class="knob"></div></div>

    <div class="abs label" style="left:40px; top:100px;">起始号码</div>
    <div class="abs label" style="left:320px; top:100px;">终止号码</div>
    <div class="abs edit" style="left:40px; top:126px; width:260px;">1</div>
    <div class="abs edit" style="left:320px; top:126px; width:260px;">50</div>
    <div class="abs btn" style="left:600px; top:126px; width:320px;">开 始</div>

    <div class="abs reel">
      <div class="tile" style="left:24px; border-color:#B0C3D9; background:#F6F8FB;">
        7<div class="bar" style="background:#B0C3D9"></div></div>
      <div class="tile" style="left:156px; border-color:#4B69FF; background:#EDF0FF;">
        23<div class="bar" style="background:#4B69FF"></div></div>
      <div class="tile" style="left:288px; border-color:#4CC38A; background:#EDFAF3;">
        41<div class="bar" style="background:#4CC38A"></div></div>
      <div class="tile gold" style="left:420px;">
        37<div class="bar" style="background:#F0B429"></div></div>
      <div class="tile" style="left:552px; border-color:#EB4B4B; background:#FDEDED;">
        12<div class="bar" style="background:#EB4B4B"></div></div>
      <div class="tile" style="left:684px; border-color:#B0C3D9; background:#F6F8FB;">
        58<div class="bar" style="background:#B0C3D9"></div></div>
      <div class="tile" style="left:816px; border-color:#4B69FF; background:#EDF0FF;">
        3<div class="bar" style="background:#4B69FF"></div></div>

      <div class="tri"></div>
      <div class="tri tri2"></div>
    </div>

    <div class="abs card">
      <div class="abs cardlabel">抽中号码</div>
      <div class="abs result">37</div>
    </div>
  </div>
</div>

</body>
</html>
