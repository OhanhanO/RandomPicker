<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9ecf1; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
         padding: 18px; }
  .stage { display: flex; flex-direction: column; gap: 22px; }
  .win { width: 682px; height: 492px; background: #F4F6F9; position: relative;
         border: 1px solid #b9c0cb; box-shadow: 0 10px 34px rgba(0,0,0,.20); }
  .titlebar { height: 30px; background: #fbfcfd; border-bottom: 1px solid #dde1e7;
              font-size: 12px; color: #555; display: flex; align-items: center;
              justify-content: space-between; padding: 0 12px; }
  .client { position: absolute; left: 1px; top: 31px; right: 1px; bottom: 1px;
            background: #F4F6F9; overflow: hidden; }
  .abs { position: absolute; }
  .title { font-size: 22px; font-weight: 700; color: #181B21; left: 28px; top: 16px; }
  .label { font-size: 13px; color: #78808C; }
  .edit { height: 50px; border: 1px solid #DEE2E8; border-radius: 10px; background: #fff;
          display: flex; align-items: center; padding: 0 14px; font-size: 19px; color: #181B21; }
  .card { left: 28px; top: 168px; width: 624px; height: 170px; background: #fff;
          border: 1px solid #DEE2E8; border-radius: 12px; }
  .cardlabel { font-size: 13px; color: #78808C; left: 18px; top: 12px; }
  .result { left: 14px; top: 44px; right: 14px; bottom: 16px; border: 1px solid #DEE2E8;
            border-radius: 10px; background: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 48px; font-weight: 700; color: #181B21; }
  .btn { height: 68px; left: 28px; right: 28px; top: 360px; background: #2563EB;
         border-radius: 12px; color: #fff; font-size: 20px; font-weight: 700;
         display: flex; align-items: center; justify-content: center; letter-spacing: 2px; }
  .sbtn { height: 32px; width: 96px; background: #fff; border: 1px solid #DEE2E8;
          border-radius: 8px; font-size: 12px; color: #181B21;
          display: flex; align-items: center; justify-content: center; }
  .list { left: 28px; top: 76px; width: 624px; height: 282px; background: #fff;
          border: 1px solid #DEE2E8; border-radius: 12px; }
  .row { position: absolute; left: 6px; width: 612px; height: 38px; }
  .num { left: 12px; top: 9px; font-size: 16px; color: #181B21; }
  .pill { position: absolute; width: 64px; height: 26px; border: 1px solid #E8ECF1;
          background: #F4F6F9; border-radius: 7px; font-size: 16px;
          display: flex; align-items: center; justify-content: center; top: 6px; left: 458px; }
  .pct { position: absolute; font-size: 12px; color: #78808C; text-align: right;
         top: 11px; left: 528px; width: 76px; }
  .save { height: 60px; left: 28px; right: 28px; top: 382px; background: #2563EB;
          border-radius: 12px; color: #fff; font-size: 20px; font-weight: 700;
          display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="stage">

  <!-- 主界面 -->
  <div class="win">
    <div class="titlebar"><span>随机抽号器</span><span>—　□　×</span></div>
    <div class="client">
      <div class="abs title">随机抽号器</div>

      <div class="abs label" style="left:28px; top:68px;">起始号码</div>
      <div class="abs label" style="left:350px; top:68px;">终止号码</div>
      <div class="abs edit" style="left:28px; top:94px; width:302px;">1</div>
      <div class="abs edit" style="left:350px; top:94px; width:302px;">50</div>

      <div class="abs card">
        <div class="abs cardlabel">抽中号码</div>
        <div class="abs result">37</div>
      </div>

      <div class="abs btn">开　始</div>
    </div>
  </div>

  <!-- 权重后台 -->
  <div class="win">
    <div class="titlebar"><span>随机抽号器</span><span>—　□　×</span></div>
    <div class="client">
      <div class="abs title">号码权重</div>
      <div class="abs sbtn" style="left:450px; top:26px;">全部设为 5</div>
      <div class="abs sbtn" style="left:556px; top:26px;">全部设为 0</div>

      <div class="abs list">
        <div class="row" style="top:4px; background:#E9F0FE; border-radius:8px;">
          <span class="num abs">1</span>
          <span class="pill" style="border-color:#2563EB; color:#2563EB; background:#E2ECFF;">10</span>
          <span class="pct">3.9%</span>
        </div>
        <div class="row" style="top:42px;">
          <span class="num abs">2</span><span class="pill">5</span><span class="pct">2.0%</span>
        </div>
        <div class="row" style="top:80px;">
          <span class="num abs">3</span><span class="pill">5</span><span class="pct">2.0%</span>
        </div>
        <div class="row" style="top:118px;">
          <span class="num abs">4</span><span class="pill">0</span><span class="pct">0%</span>
        </div>
        <div class="row" style="top:156px;">
          <span class="num abs">5</span><span class="pill">5</span><span class="pct">2.0%</span>
        </div>
        <div class="row" style="top:194px;">
          <span class="num abs">6</span><span class="pill">5</span><span class="pct">2.0%</span>
        </div>
        <div class="row" style="top:232px;">
          <span class="num abs">7</span><span class="pill">5</span><span class="pct">2.0%</span>
        </div>
      </div>

      <div class="abs save">保存并关闭</div>
    </div>
  </div>

</div>
</body>
</html>
