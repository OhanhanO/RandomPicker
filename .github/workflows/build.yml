name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: List output
        run: dir build\Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-x64
          path: build/Release/RandomPicker.exe
          if-no-files-found: error
